version: '3.8'

services:
  momu_postgres:
    image: postgres:15-alpine
    container_name: momu_postgres
    restart: always
    shm_size: 256mb
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command: >
      postgres 
      -c shared_buffers=512MB 
      -c work_mem=64MB 
      -c maintenance_work_mem=128MB 
      -c effective_cache_size=1GB
      -c max_wal_size=1GB
    volumes:
      - momu-db-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - momu-network

  momu_redis:
    image: redis:7-alpine
    container_name: momu_redis
    ports:
      - "6379:6379"
    restart: always
    networks:
      - momu-network

  app:
    build: .
    container_name: momu_app

    command: uvicorn main:app --host 0.0.0.0 --port ${APP_PORT} --reload
    volumes:
      - ./app:/app
    environment:
      PYTHONPATH: /app
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "${APP_PORT}:${APP_PORT}"
    env_file:
      - .env
    depends_on:
      momu_postgres:
        condition: service_healthy
      momu_redis:
        condition: service_started
    networks:
      - momu-network

  momu_worker:
    build: .
    container_name: momu_worker
    restart: always
    command: watchfiles --filter python "celery -A core.celery_app worker --loglevel=info"
    volumes:
      - ./app:/app
    environment:
      PYTHONPATH: /app
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      DATABASE_URL: ${DATABASE_URL} 
    env_file:
      - .env
    depends_on:
      momu_postgres:
        condition: service_healthy
      momu_redis:
        condition: service_started
    networks:
      - momu-network

volumes:
  momu-db-data:

networks:
  momu-network:
    driver: bridge